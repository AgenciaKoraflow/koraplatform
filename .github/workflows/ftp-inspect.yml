name: FTP Inspect (temporary)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List folders
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_DIR }}
        run: |
          ls_dir() {
            echo "=== [$2]"
            curl -s --ssl-reqd -k --user "$U:$P" "ftp://$H/$1" | awk '{print $1, $6, $7, $8, $9}' | head -40 || echo "(falhou)"
          }
          ls_dir "domains/koraflow.com.br/public_html/" "public_html do dominio"
          ls_dir "domains/koraflow.com.br/public_html/app/" "public_html/app"
          ls_dir "home/" "home (criada pelo deploy errado)"
          ls_dir "home/u111960110/" "home/u..."
          ls_dir "home/u111960110/domains/" "home/u.../domains"
          ls_dir "home/u111960110/domains/koraflow.com.br/" "home/u.../domains/koraflow.com.br"
